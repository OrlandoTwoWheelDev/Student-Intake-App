services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - db
    environment:
      - APP_UID=1000
      - ConnectionStrings__DefaultConnection=Server=db;Database=StudentIntakeApp;User Id=sa;Password=Your_password123;Encrypt=True;TrustServerCertificate=True;
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
